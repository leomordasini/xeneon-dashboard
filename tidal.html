<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tidal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, .nav-btn { touch-action: manipulation; cursor: pointer; }

:root {
  --bg: #07070f;
  --surface: rgba(255,255,255,0.06);
  --surface2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.10);
  --text: #f0f0f8;
  --text-dim: rgba(240,240,248,0.45);
  --accent: #00e5ff;
  --nav-h: 52px;
  --t: 0.15s ease;
}

html, body {
  width: 2536px; height: 696px;
  overflow: hidden;
  background: var(--bg);
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  user-select: none;
}

/* ── IFRAME WRAPPER ── */
.frame-wrap {
  position: absolute;
  top: 0; left: 0;
  width: 2536px;
  height: calc(696px - var(--nav-h));
  overflow: hidden;
  background: #000;
}

iframe#tidal-frame {
  width: 2536px;
  height: calc(696px - var(--nav-h));
  border: none;
  display: block;
  /* Scale down Tidal's 1080p viewport to fit Xeneon's 696px height */
  transform-origin: top left;
}

/* ── OVERLAY shown while loading ── */
.loader {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 28px;
  background: var(--bg); z-index: 10; transition: opacity 0.4s;
}
.loader.hidden { opacity: 0; pointer-events: none; }
.loader-logo { font-size: 80px; }
.loader-text { font-size: 36px; font-weight: 600; color: var(--text-dim); }
.loader-sub  { font-size: 24px; color: rgba(240,240,248,0.3); }

/* ── BOTTOM NAV ── */
.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
  display: flex; justify-content: center; align-items: center; gap: 32px;
  background: rgba(7,7,15,0.96); border-top: 1px solid var(--border);
  backdrop-filter: blur(10px); z-index: 100;
}
.nav-btn {
  padding: 10px 36px; border-radius: 50px; font-size: 22px; font-weight: 600;
  color: var(--text-dim); border: none; background: none; transition: all var(--t);
  text-decoration: none; display: flex; align-items: center; gap: 10px;
}
.nav-btn:hover, .nav-btn.active { color: var(--text); background: var(--surface2); }
.nav-btn.active { color: var(--accent); }

/* ── TIDAL LOGIN PROMPT ── */
.login-prompt {
  position: absolute; inset: 0; z-index: 20;
  display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 32px;
  background: var(--bg);
}
.login-prompt.show { display: flex; }
.lp-title { font-size: 52px; font-weight: 700; }
.lp-title span { color: var(--accent); }
.lp-body { font-size: 30px; color: var(--text-dim); text-align: center; max-width: 900px; line-height: 1.5; }
.lp-btn {
  padding: 24px 72px; border-radius: 16px;
  background: var(--accent); color: #000; font-size: 30px; font-weight: 700;
  border: none; transition: opacity 0.2s;
}
.lp-btn:active { opacity: 0.8; }
</style>
</head>
<body>

<!-- IFRAME -->
<div class="frame-wrap" id="frame-wrap">
  <div class="loader" id="loader">
    <div class="loader-logo">🎵</div>
    <div class="loader-text">Loading Tidal…</div>
    <div class="loader-sub">Your session will be remembered after first login.</div>
  </div>

  <iframe
    id="tidal-frame"
    src="https://listen.tidal.com"
    allow="autoplay; encrypted-media; fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
  ></iframe>
</div>

<!-- BOTTOM NAV -->
<nav class="nav-bar">
  <a class="nav-btn" href="lights.html">💡 Lights</a>
  <a class="nav-btn" href="mixer.html">🎚 Mixer</a>
  <a class="nav-btn active" href="tidal.html">🎵 Tidal</a>
  <a class="nav-btn" href="youtube.html">▶ YouTube</a>
</nav>

<script>
const frame  = document.getElementById('tidal-frame');
const loader = document.getElementById('loader');

// Scale iframe to fit Xeneon screen height (Tidal renders at ~900px viewport height)
// We display at 644px (696 - 52 nav), so scale = 644/900
function scaleFrame() {
  const availH = 696 - 52;
  const targetW = 2536;
  // Use a viewport-filling approach: set iframe to a natural resolution, then scale
  const naturalH = 860;
  const naturalW = Math.round(naturalH * (targetW / availH));
  const scale    = availH / naturalH;
  frame.style.width           = naturalW + 'px';
  frame.style.height          = naturalH + 'px';
  frame.style.transform       = `scale(${scale})`;
  frame.style.transformOrigin = 'top left';
}

scaleFrame();

// Hide loader once iframe sends any signal it's loaded
frame.addEventListener('load', () => {
  setTimeout(() => loader.classList.add('hidden'), 800);
});

// Fallback: hide loader after 6s regardless
setTimeout(() => loader.classList.add('hidden'), 6000);
</script>
</body>
</html>
